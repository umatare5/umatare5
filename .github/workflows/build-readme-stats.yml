name: Build static github-readme-stats

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *" # Every day at 09:30 JST (00:30 UTC)

permissions:
  contents: write

env:
  GRS_API_BASE: https://github-readme-stats-fast.vercel.app/api
  GRS_ASSET_DIR: docs/assets
  GRS_LIGHT_THEME: default
  GRS_DARK_THEME: algolia
  GITHUB_USER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate SVGs into docs/assets/
        run: |
          mkdir -p "${{ env.GRS_ASSET_DIR }}"
          curl -fsS "${{ env.GRS_API_BASE }}?username=${{ env.GITHUB_USER }}&show_icons=true&count_private=true&hide=stars&theme=${{ env.GRS_LIGHT_THEME }}" -o "${{ env.GRS_ASSET_DIR }}/readme_stats_light.svg"
          curl -fsS "${{ env.GRS_API_BASE }}?username=${{ env.GITHUB_USER }}&show_icons=true&count_private=true&hide=stars&theme=${{ env.GRS_DARK_THEME }}" -o "${{ env.GRS_ASSET_DIR }}/readme_stats_dark.svg"

      - name: Commit changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          if grep -q "Something went wrong" "${{ env.GRS_ASSET_DIR }}/readme_stats_light.svg" "${{ env.GRS_ASSET_DIR }}/readme_stats_dark.svg"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ env.GRS_ASSET_DIR }}/*.svg"
          git commit -m "cron-daily: refresh readme_stats_(light|dark).svg"
          git push
